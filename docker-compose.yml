# PostgreSQL for local development.
#
# The application connects over the published port on localhost, so this service
# is for development only. Production uses a managed database and DATABASE_URL
# pointing at it, never a container on the application host.
services:
  db:
    image: postgres:16-alpine
    container_name: ju-meal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ju_meal}
      POSTGRES_USER: ${POSTGRES_USER:-ju_meal}
      # Development default only. Override in .env, never commit a real password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ju_meal_dev_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Left side is the host port. Change it if 5432 is already in use locally.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ju-meal-db-data:/var/lib/postgresql/data
    healthcheck:
      # The server is only considered started once it accepts connections and
      # can authenticate, which is what the application needs.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ju_meal} -d ${POSTGRES_DB:-ju_meal}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

volumes:
  ju-meal-db-data:
    name: ju-meal-db-data
